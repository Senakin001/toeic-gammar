  <!-- UI & LOGIC SCRIPT -->
  <script>
    const STORAGE_KEY = 'toeic_grammar_standalone_v2';
    let soundEnabled = true;

    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('toeic_grammar_standalone_v1');
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            masteredIds: parsed.masteredIds || [],
            bookmarkedIds: parsed.bookmarkedIds || [],
            mistakeCounts: parsed.mistakeCounts || {},
            solveTimes: parsed.solveTimes || {},
            srsStates: parsed.srsStates || {},
            unlockedAchievements: parsed.unlockedAchievements || {},
            dailyGoal: parsed.dailyGoal || 10,
            dailyHistory: parsed.dailyHistory || {}
          };
        }
      } catch (e) {}
      return { masteredIds: [], bookmarkedIds: [], mistakeCounts: {}, solveTimes: {}, srsStates: {}, unlockedAchievements: {}, dailyGoal: 10, dailyHistory: {} };
    }

    function saveProgress(data) {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
    }

    let progress = loadProgress();
    let showQuitModal = false;
    let showGoalModal = false;

    // Web Audio Synthesizer
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) {
        const AudioClass = window.AudioContext || window.webkitAudioContext;
        if (AudioClass) audioCtx = new AudioClass();
      }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playDing() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx(); if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, now);
        osc.frequency.exponentialRampToValueAtTime(1320, now + 0.12);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.35);
      } catch(e){}
    }

    function playBuzzer() {
      if (!soundEnabled) return;
      try {
        const ctx = getAudioCtx(); if (!ctx) return;
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(130, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now); osc.stop(now + 0.35);
      } catch(e){}
    }

    // TTS Speech
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const clean = text.replace(/(-{2,}|_{2,})/g, 'blank');
      const u = new SpeechSynthesisUtterance(clean);
      u.lang = 'en-US';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
    }

    // Spaced repetition interval days: [0, 1, 3, 7, 14, 30]
    const SRS_INTERVALS = [0, 1, 3, 7, 14, 30];
    function updateSRS(qId, isCorrect) {
      const now = Date.now();
      const DAY = 86400000;
      let curr = progress.srsStates[qId] || { level: 0, consecutive: 0, reviews: 0 };
      if (isCorrect) {
        const nextLvl = Math.min(5, curr.level + 1);
        progress.srsStates[qId] = {
          level: nextLvl,
          consecutive: curr.consecutive + 1,
          nextReview: now + SRS_INTERVALS[nextLvl] * DAY,
          reviews: curr.reviews + 1
        };
      } else {
        progress.srsStates[qId] = {
          level: 0,
          consecutive: 0,
          nextReview: now,
          reviews: curr.reviews + 1
        };
      }
    }

    // App state
    let currentTab = 'test';
    let selectedChapter = 'all';
    let selectedMode = '10';
    let excludeMastered = true;

    let isTesting = false;
    let testQueue = [];
    let currentQIndex = 0;
    let currentAnswer = null;
    let hasAnswered = false;
    let sessionHistory = [];
    let timerInterval = null;
    let startTime = 0;
    let secondsLeft = 20;

    function switchTab(tab) {
      currentTab = tab;
      ['test', 'srs', 'achievements', 'rules', 'stats'].forEach(t => {
        const btn = document.getElementById('tabBtn-' + t);
        if (btn) {
          if (t === tab) {
            btn.className = "flex-1 py-2 px-2 rounded-lg text-xs font-bold bg-amber-500 text-slate-950 shadow-md";
          } else {
            btn.className = "flex-1 py-2 px-2 rounded-lg text-xs font-bold text-slate-400 hover:text-slate-200";
          }
        }
      });
      render();
    }

    document.getElementById('soundToggleBtn').addEventListener('click', function() {
      soundEnabled = !soundEnabled;
      this.textContent = soundEnabled ? '🔔 音ON' : '🔕 音OFF';
    });

    function startTestSession(customList) {
      let pool = customList ? [...customList] : CHAPTER_DATA.filter(q => {
        if (selectedMode === 'srs') {
          const s = progress.srsStates[q.id];
          if (!s) return true;
          return Date.now() >= (s.nextReview || 0);
        }
        if (selectedChapter !== 'all' && q.chapterId != selectedChapter) return false;
        if (excludeMastered && progress.masteredIds.includes(q.id)) return false;
        if (selectedMode === 'mistakes') return (progress.mistakeCounts[q.id] || 0) > 0;
        if (selectedMode === 'bookmarked') return progress.bookmarkedIds.includes(q.id);
        return true;
      });

      if (!pool.length) {
        alert('該当する問題がありません。');
        return;
      }

      if (!customList && (selectedMode === '10' || selectedMode === '30')) {
        pool.sort(() => Math.random() - 0.5);
        pool = pool.slice(0, selectedMode === '10' ? 10 : 30);
      }

      testQueue = pool;
      currentQIndex = 0;
      sessionHistory = [];
      hasAnswered = false;
      currentAnswer = null;
      isTesting = true;
      document.getElementById('topNav').style.display = 'none';
      startTimer();
      render();
    }

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      secondsLeft = 20;
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const diff = Math.floor((Date.now() - startTime) / 1000);
        secondsLeft = Math.max(0, 20 - diff);
        const timerEl = document.getElementById('timerDisplay');
        const barEl = document.getElementById('timerBar');
        if (timerEl && !hasAnswered) {
          timerEl.textContent = secondsLeft + 's';
          if (secondsLeft <= 5) timerEl.className = 'font-mono font-bold px-2 py-0.5 rounded text-xs bg-red-500/20 text-red-400 border border-red-500/30';
          else if (secondsLeft <= 10) timerEl.className = 'font-mono font-bold px-2 py-0.5 rounded text-xs bg-amber-500/20 text-amber-300 border border-amber-500/30';
        }
        if (barEl && !hasAnswered) barEl.style.width = ((secondsLeft / 20) * 100) + '%';
      }, 200);
    }

    function stopTimer() {
      if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function submitChoice(letter) {
      if (hasAnswered) return;
      stopTimer();
      hasAnswered = true;
      currentAnswer = letter;
      const q = testQueue[currentQIndex];
      const elapsed = Math.max(1, Math.round(((Date.now() - startTime) / 100) / 10));
      const isCorrect = letter === q.correctAnswer;

      if (isCorrect) playDing(); else playBuzzer();

      if (!isCorrect) {
        progress.mistakeCounts[q.id] = (progress.mistakeCounts[q.id] || 0) + 1;
      }
      progress.solveTimes[q.id] = [...(progress.solveTimes[q.id] || []), elapsed];
      
      const today = getTodayStr();
      progress.dailyHistory = progress.dailyHistory || {};
      progress.dailyHistory[today] = (progress.dailyHistory[today] || 0) + 1;

      updateSRS(q.id, isCorrect);
      saveProgress(progress);

      sessionHistory.push({ q, letter, isCorrect, elapsed });
      render();
    }

    function openQuitModal() {
      stopTimer();
      showQuitModal = true;
      render();
    }

    function resumeTest() {
      showQuitModal = false;
      if (!hasAnswered) {
        startTimer();
      }
      render();
    }

    function finishEarly() {
      showQuitModal = false;
      stopTimer();
      isTesting = false;
      document.getElementById('topNav').style.display = 'flex';
      renderResults();
    }

    function quitToHome() {
      showQuitModal = false;
      stopTimer();
      isTesting = false;
      document.getElementById('topNav').style.display = 'flex';
      render();
    }

    function saveDailyGoal(val) {
      progress.dailyGoal = Number(val) || 10;
      saveProgress(progress);
      showGoalModal = false;
      render();
    }

    function nextQuestion() {
      if (currentQIndex + 1 < testQueue.length) {
        currentQIndex++;
        hasAnswered = false;
        currentAnswer = null;
        startTimer();
        render();
      } else {
        stopTimer();
        isTesting = false;
        document.getElementById('topNav').style.display = 'flex';
        renderResults();
      }
    }

    function undoQuestion() {
      if (currentQIndex === 0) return;
      stopTimer();
      currentQIndex--;
      sessionHistory.pop();
      hasAnswered = false;
      currentAnswer = null;
      startTimer();
      render();
    }

    function toggleBookmark(id) {
      if (progress.bookmarkedIds.includes(id)) {
        progress.bookmarkedIds = progress.bookmarkedIds.filter(x => x !== id);
      } else {
        progress.bookmarkedIds.push(id);
      }
      saveProgress(progress);
      render();
    }

    function toggleMaster(id) {
      if (progress.masteredIds.includes(id)) {
        progress.masteredIds = progress.masteredIds.filter(x => x !== id);
      } else {
        progress.masteredIds.push(id);
      }
      saveProgress(progress);
      render();
    }

    const container = document.getElementById('appContainer');

    function render() {
      if (isTesting) renderQuestionScreen();
      else if (currentTab === 'test') renderSetupScreen();
      else if (currentTab === 'srs') renderSRSScreen();
      else if (currentTab === 'achievements') renderAchievementsScreen();
      else if (currentTab === 'rules') renderRulesScreen();
      else if (currentTab === 'stats') renderStatsScreen();

      if (showQuitModal) renderQuitModal();
      if (showGoalModal) renderGoalModal();
    }

    function renderQuitModal() {
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in";
      modal.innerHTML = `
        <div class="bg-slate-850 border border-slate-700 rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-rose-500/10 border border-rose-500/30 flex items-center justify-center text-rose-400 font-bold text-lg">✕</div>
            <div>
              <h3 class="text-base font-bold text-slate-100">演習を中断しますか？</h3>
              <p class="text-xs text-slate-400">現在の解答記録は保持されます</p>
            </div>
          </div>
          <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-750 text-xs space-y-1.5 text-slate-300">
            <div class="flex justify-between"><span>解答済み:</span><strong class="text-amber-400">${sessionHistory.length} / ${testQueue.length} 問</strong></div>
            <div class="flex justify-between"><span>正解数:</span><strong class="text-emerald-400">${sessionHistory.filter(h => h.isCorrect).length} 問</strong></div>
          </div>
          <div class="space-y-2 pt-1">
            ${sessionHistory.length > 0 ? '<button onclick="finishEarly()" class="w-full py-2.5 px-3 rounded-xl font-bold bg-amber-500 text-slate-950 text-xs cursor-pointer">ここまでの結果を確認して終了</button>' : ''}
            <button onclick="quitToHome()" class="w-full py-2 px-3 rounded-xl font-semibold bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 text-xs cursor-pointer">ホームへ戻る</button>
            <button onclick="resumeTest()" class="w-full py-2 text-slate-400 hover:text-slate-200 text-xs cursor-pointer">↩ 演習を続ける</button>
          </div>
        </div>
      `;
      container.appendChild(modal);
    }

    function renderGoalModal() {
      const modal = document.createElement('div');
      modal.className = "fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 animate-in fade-in";
      modal.innerHTML = `
        <div class="bg-slate-850 border border-slate-700 rounded-3xl p-6 max-w-sm w-full shadow-2xl space-y-4">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-amber-400 font-bold text-lg">🎯</span>
              <h3 class="text-base font-bold text-slate-100">1日の目標問題数</h3>
            </div>
            <button onclick="showGoalModal=false; render();" class="text-slate-400 hover:text-slate-200 text-lg">✕</button>

    }

    function renderResults() {
      const correct = sessionHistory.filter(h => h.isCorrect).length;
      const total = sessionHistory.length;
      const pct = Math.round((correct / (total || 1)) * 100);
      const avg = total > 0 ? (sessionHistory.reduce((a, b) => a + b.elapsed, 0) / total).toFixed(1) : '0.0';
      const missed = sessionHistory.filter(h => !h.isCorrect).map(h => h.q);

      let historyHtml = sessionHistory.map((h, i) => `
        <div class="bg-slate-800/80 border border-slate-700/80 rounded-xl p-3.5 flex items-start justify-between gap-3 text-sm">
          <div>
            <div class="flex items-center gap-2 text-xs text-slate-400 mb-0.5">
              <span class="font-mono font-bold text-slate-300">Q${i + 1}</span>
              <span>${h.q.numberLabel}</span>
              <span class="font-mono text-slate-500">(${h.elapsed}秒)</span>
            </div>
            <p class="text-slate-200 text-xs font-serif line-clamp-1">${h.q.sentence}</p>
            <p class="text-xs text-amber-400 font-semibold mt-1">${h.q.keyRule}</p>
          </div>
          <span class="text-xs font-mono font-bold px-2 py-0.5 rounded ${h.isCorrect ? 'bg-emerald-500/20 text-emerald-300' : 'bg-rose-500/20 text-rose-300'}">
            ${h.letter} (${h.isCorrect ? '○' : '✕ 正解:' + h.q.correctAnswer})
          </span>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="space-y-5">
          <div class="bg-slate-800 border border-amber-500/30 rounded-3xl p-6 text-center shadow-2xl">
            <h2 class="text-xl font-black text-slate-100">テスト完了！お疲れ様でした</h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 max-w-lg mx-auto mt-4">
              <div class="bg-slate-950/60 border border-slate-700 rounded-2xl p-3">
                <span class="text-[11px] text-slate-400 block">正解率</span>
                <div class="text-2xl font-black text-amber-400 font-mono">${pct}%</div>
                <span class="text-[10px] text-slate-400">${correct} / ${total} 問正解</span>
              </div>
              <div class="bg-slate-950/60 border border-slate-700 rounded-2xl p-3">
                <span class="text-[11px] text-slate-400 block">平均所要時間</span>
                <div class="text-2xl font-black text-emerald-400 font-mono">${avg}s</div>
                <span class="text-[10px] text-slate-400">目標: 20秒以内</span>
              </div>
              <div class="col-span-2 sm:col-span-1 bg-slate-950/60 border border-slate-700 rounded-2xl p-3">
                <span class="text-[11px] text-slate-400 block">スピード評価</span>
                <div class="text-sm font-bold mt-1 text-slate-200">
                  ${parseFloat(avg) <= 15 ? '<span class="text-emerald-400">⚡ 快速合格ペース</span>' : parseFloat(avg) <= 20 ? '<span class="text-amber-400">🎯 標準合格ペース</span>' : '<span class="text-rose-400">⚠️ 要スピード改善</span>'}
                </div>
              </div>
            </div>
            <div class="flex flex-col sm:flex-row gap-2 max-w-md mx-auto mt-5">
              ${missed.length > 0 ? `
                <button onclick="startTestSession(window._lastMissed)" class="flex-1 py-3 px-4 rounded-xl font-bold bg-rose-600 hover:bg-rose-500 text-white text-sm">
                  🔥 間違えた問題だけ再テスト (${missed.length}問)
                </button>
              ` : ''}
              <button onclick="startTestSession()" class="flex-1 py-3 px-4 rounded-xl font-bold bg-amber-500 text-slate-950 text-sm">
                もう一度テストする
              </button>
              <button onclick="switchTab('test')" class="py-3 px-4 rounded-xl font-bold bg-slate-700 text-slate-300 text-sm">
                戻る
              </button>
            </div>
          </div>
          <div class="space-y-2">
            <h3 class="text-sm font-bold text-slate-300">今回の解答一覧</h3>
            ${historyHtml}
          </div>
        </div>
      `;
      window._lastMissed = missed;
    }

    function renderRulesScreen() {
      let rulesHtml = GOLDEN_RULES.map(r => `
        <div class="bg-slate-800 border border-slate-700/80 rounded-xl p-4 shadow-sm">
          <div class="flex items-center gap-2 mb-1">
            <span class="font-mono text-xs font-bold bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded border border-amber-500/30">
              ルール ${r.ruleNo}
            </span>
            <span class="text-[11px] text-slate-400">第${r.chapterId}章</span>
          </div>
          <h4 class="text-sm font-bold text-slate-100">${r.title}</h4>
          <p class="text-xs text-slate-300 mt-1 leading-relaxed bg-slate-900/60 p-2.5 rounded-lg border border-slate-700/40">${r.content}</p>
        </div>
      `).join('');

      let colsHtml = CHAPTER_COLUMNS.map(c => `
        <div class="bg-slate-800 border border-amber-500/30 rounded-2xl p-4 shadow-md">
          <h4 class="font-bold text-slate-100 text-sm mb-2 text-amber-300">✨ ${c.title}</h4>
          <div class="text-xs text-slate-300 leading-relaxed whitespace-pre-line">${c.content}</div>
        </div>
      `).join('');

      container.innerHTML = `
        <div class="space-y-5">
          <div class="space-y-3">
            <h3 class="text-xs font-bold text-amber-400 uppercase tracking-wider">特別コラム</h3>
            ${colsHtml}
          </div>
          <div class="space-y-3">
            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">金の文法ルール一覧 (${GOLDEN_RULES.length})</h3>
            <div class="space-y-2.5">${rulesHtml}</div>
          </div>
        </div>
      `;
    }

    function renderStatsScreen() {
      const total = CHAPTER_DATA.length;
      const mastered = progress.masteredIds.length;
      const bookmarked = progress.bookmarkedIds.length;

      container.innerHTML = `
        <div class="space-y-5">
          <div class="bg-slate-800 border border-slate-700 rounded-3xl p-5 shadow-xl">
            <h3 class="text-sm font-bold text-slate-100 mb-3">📊 学習データ概要</h3>
            <div class="grid grid-cols-3 gap-3 text-center">
              <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                <span class="text-[10px] text-slate-400 block">総問題数</span>
                <span class="text-lg font-bold font-mono text-slate-200">${total}問</span>
              </div>
              <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                <span class="text-[10px] text-slate-400 block">覚えた</span>
                <span class="text-lg font-bold font-mono text-emerald-400">${mastered}問</span>
              </div>
              <div class="bg-slate-900 p-3 rounded-xl border border-slate-700">
                <span class="text-[10px] text-slate-400 block">要復習</span>
                <span class="text-lg font-bold font-mono text-sky-400">${bookmarked}問</span>
              </div>
            </div>
          </div>

          <div class="bg-slate-800 border border-slate-700 rounded-3xl p-5 shadow-xl space-y-3">
            <h3 class="text-sm font-bold text-slate-100">💾 バックアップコード (JSON)</h3>
            <p class="text-xs text-slate-400">機種変更やブラウザ変更時にコピーして引き継げます。</p>
            <div class="flex gap-2">
              <button onclick="copyBackup()" class="py-2 px-3 rounded-xl text-xs font-bold bg-amber-500 text-slate-950">
                バックアップをコピー
              </button>
              <button onclick="restoreBackup()" class="py-2 px-3 rounded-xl text-xs font-bold bg-slate-700 text-slate-200">
                テキストから復元
              </button>
            </div>
            <textarea id="backupArea" rows="4" class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs font-mono text-slate-300"></textarea>
          </div>
        </div>
      `;
      document.getElementById('backupArea').value = JSON.stringify(progress, null, 2);
    }

    function copyBackup() {
      const area = document.getElementById('backupArea');
      area.select();
      document.execCommand('copy');
      alert('バックアップコードをコピーしました！');
    }

    function restoreBackup() {
      try {
        const area = document.getElementById('backupArea');
        const parsed = JSON.parse(area.value);
        if (parsed) {
          progress = parsed;
          saveProgress(progress);
          alert('復元が完了しました！');
          render();
        }
      } catch (e) {
        alert('無効なJSONフォーマットです。');
      }
    }

    render();
  </script>
</body>
</html>
